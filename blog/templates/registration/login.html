{% extends 'blog/base.html' %}

{% block content %}
    <h2>Iniciar sesión</h2>
    {% if form.errors %}
        <p role="alert">El usuario o la contraseña no son correctos.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="save btn btn-secondary">Entrar</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
{% endblock %}
